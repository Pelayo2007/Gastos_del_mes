<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mis Gastos del Mes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="app-header">
    <h1>🧾 Mis Gastos del Mes</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="builder" type="button">Nuevo Ticket</button>
      <button class="tab-btn" data-tab="history" type="button">Historial</button>
    </nav>
  </header>

  <main>
    <!-- ===== BUILDER VIEW ===== -->
    <section id="view-builder" class="view active">

      <div class="card">
        <h2>Datos del ticket</h2>
        <div class="field-row">
          <label>Nombre del ticket <span class="hint">(mes y año)</span>
            <input type="text" id="ticketName" placeholder="Ej: Junio 2026" />
          </label>
          <label>Objetivo de gasto (€)
            <input type="number" id="ticketGoal" min="0" step="0.01" placeholder="0.00" />
          </label>
        </div>
        <small class="error-msg" id="builderError"></small>
      </div>

      <div class="card">
        <h2>Añadir pago</h2>

        <div class="field-row">
          <label style="flex:2;">Categoría
            <select id="paymentCategory"></select>
          </label>
          <button class="btn-ghost" id="btnOpenCategoryModal" type="button">+ Crear categoría</button>
        </div>

        <div id="categoryLegend" class="legend"></div>

        <div class="field-row">
          <label style="flex:2;">Nombre del gasto
            <input type="text" id="paymentName" placeholder="Ej: Cine" />
          </label>
          <label>Precio (€)
            <input type="number" id="paymentPrice" min="0" step="0.01" placeholder="0.00" />
          </label>
        </div>
        <button class="btn-primary" id="btnAddPayment" type="button" style="width:100%;">Añadir pago</button>
        <small class="error-msg" id="paymentError"></small>

        <div id="paymentsList" class="payments-list">
          <p class="empty-hint">Aún no has añadido pagos</p>
        </div>

        <button class="btn-sum" id="btnSum" type="button">🧮 Sumar</button>
      </div>

      <section id="resultsSection" class="card results hidden">
        <h2>Resultados</h2>
        <div id="categoryBars" class="bars"></div>
        <div class="grand-total">
          <span>Total gastado</span>
          <strong id="grandTotalValue">0,00 €</strong>
        </div>
        <div id="goalMessage" class="goal-message"></div>
        <button class="btn-make-ticket" id="btnRealizarTicket" type="button">🧾 Realizar Ticket</button>
      </section>
    </section>

    <!-- ===== HISTORY VIEW ===== -->
    <section id="view-history" class="view">
      <div class="history-toolbar">
        <button class="btn-ghost" id="btnExport" type="button">⬇️ Exportar JSON</button>
        <label class="btn-ghost file-label">⬆️ Importar JSON
          <input type="file" id="importInput" accept="application/json" hidden />
        </label>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty-state">Cargando historial…</p>
      </div>
    </section>
  </main>
</div>

<!-- Create category modal -->
<div id="categoryModal" class="modal-overlay hidden">
  <div class="modal">
    <h3>Crear categoría</h3>
    <label>Nombre
      <input type="text" id="newCategoryName" placeholder="Ej: Regalos" />
    </label>
    <p class="hint" style="margin-top:12px;">Elige un color</p>
    <div id="colorPalette" class="palette"></div>
    <small class="error-msg" id="categoryError"></small>
    <div class="modal-actions">
      <button class="btn-ghost" id="btnCancelCategory" type="button">Cancelar</button>
      <button class="btn-primary" id="btnConfirmCategory" type="button">Crear</button>
    </div>
  </div>
</div>

<!-- Generic confirm modal -->
<div id="confirmModal" class="modal-overlay hidden">
  <div class="modal">
    <h3>¿Estás seguro?</h3>
    <p id="confirmMessage"></p>
    <div class="modal-actions">
      <button class="btn-ghost" id="btnConfirmCancel" type="button">Cancelar</button>
      <button class="btn-danger" id="btnConfirmOk" type="button">Eliminar</button>
    </div>
  </div>
</div>

<!-- Ticket detail / receipt modal -->
<div id="ticketDetailModal" class="modal-overlay hidden">
  <div class="modal modal-receipt">
    <div id="receiptContainer"></div>
    <div class="modal-actions" style="background:#fff; border-radius:0 0 14px 14px; padding:14px 4px 0;">
      <button class="btn-ghost" id="btnCloseReceipt" type="button">Cerrar</button>
      <button class="btn-danger" id="btnDeleteFromDetail" type="button">Eliminar ticket</button>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script src="script.js"></script>
</body>
</html>
